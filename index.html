<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DA40 NG OLB">
  <meta name="theme-color" content="#1a222c">
  <title>DA40 NG OLB — FlySmart Style EFB</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app-shell">
    <!-- TOP HEADER BAR (Airbus FlySmart inspired) -->
    <header class="topbar">
      <div class="topbar-left">
        <button id="btnIndex" class="tb-btn tb-index" title="Toggle Index">
          <span class="ico-bars">☰</span><span>INDEX</span>
        </button>
        <div class="nav-arrows">
          <button id="btnBack" class="tb-btn tb-icon" title="Back" disabled>◀</button>
          <button id="btnFwd" class="tb-btn tb-icon" title="Forward" disabled>▶</button>
        </div>
      </div>

      <div class="topbar-center">
        <span class="doc-meta-title" id="topDocTitle">DA40 NG AFM — REV 4 — 31-DEC-2024</span>
        <span class="offline-pill" id="offlinePill" title="Offline Cache Status">OFFLINE READY</span>
      </div>

      <div class="topbar-right">
        <div class="seg-control" id="langSwitch" title="Document Language (UI stays English)">
          <button class="seg-btn active" data-lang="en">EN</button>
          <button class="seg-btn" data-lang="ru">RU</button>
        </div>
        <button id="btnTheme" class="tb-btn tb-theme" title="Toggle Day / Night Mode">☀ DAY</button>
      </div>
    </header>

    <!-- SECONDARY TOOLBAR (Search, Favorites, Marker, Layers 1-3, Notes, Deferred) -->
    <div class="toolbar">
      <div class="tool-group">
        <button id="btnSearch" class="tool-btn" title="Global Search (EN + RU)">🔍<span>SEARCH</span></button>
        <button id="btnFavList" class="tool-btn" title="Favorites">★<span>FAV</span><em id="favCount" class="badge-num">0</em></button>
        <div class="marker-bar" id="markerBar" title="Text Highlighter Mode">
          <button class="mk-btn" data-color="off" title="Read Mode">PEN</button>
          <button class="mk-swatch mk-yellow" data-color="yellow" title="Yellow Marker"></button>
          <button class="mk-swatch mk-green" data-color="green" title="Green Marker"></button>
          <button class="mk-swatch mk-red" data-color="red" title="Red Marker"></button>
          <button class="mk-btn mk-clr" data-color="clear" title="Clear Highlight on Tap">CLR</button>
        </div>
      </div>

      <div class="layer-tabs" id="layerTabs" title="Independent Documentary Layers">
        <button class="layer-tab active" data-layer="0">Layer 1</button>
        <button class="layer-tab" data-layer="1">Layer 2</button>
        <button class="layer-tab" data-layer="2">Layer 3</button>
      </div>

      <div class="tool-group">
        <button id="btnNotes" class="tool-btn" title="Notes for Current Unit">NOTES <em id="noteCount" class="badge-num">0</em></button>
        <button id="btnDeferred" class="tool-btn tool-def" title="Deferred eQRH Items">DEF <em id="defCount" class="badge-num">0</em></button>
      </div>
    </div>

    <!-- BREADCRUMB CHEVRON BAR -->
    <nav class="breadcrumbs" id="breadcrumbs"></nav>

    <!-- MAIN SPLIT VIEW -->
    <div class="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span id="sidebarTitle">LIBRARY INDEX</span>
          <button id="btnCloseSidebar" class="sb-close">✕</button>
        </div>
        <div class="sidebar-filter">
          <input type="search" id="sidebarFilter" placeholder="Filter chapters / CAS alerts...">
        </div>
        <div class="sidebar-tree" id="sidebarTree"></div>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <main class="reader-pane" id="readerPane">
        <div class="reader-inner" id="readerContent"></div>
      </main>
    </div>

    <!-- BOTTOM DOCK (FlySmart Module Switcher) -->
    <footer class="dock">
      <button class="dock-btn" data-module="eqrh" id="dockEqrh">
        <span class="dock-ico">⚡</span>
        <span class="dock-lbl">eQRH</span>
        <span class="dock-sub">EMERG / ABNORM</span>
      </button>
      <button class="dock-btn" data-module="sop" id="dockSop">
        <span class="dock-ico">☑</span>
        <span class="dock-lbl">NORMAL SOP</span>
        <span class="dock-sub">CH. 4A CHECKLISTS</span>
      </button>
      <button class="dock-btn active" data-module="afm" id="dockAfm">
        <span class="dock-ico">▤</span>
        <span class="dock-lbl">AFM LIBRARY</span>
        <span class="dock-sub">CH. 1–2 / 5–9</span>
      </button>
      <button class="dock-btn" data-module="tools" id="dockTools">
        <span class="dock-ico">⚙</span>
        <span class="dock-lbl">DATA / BACKUP</span>
        <span class="dock-sub">NOTES &amp; OFFLINE</span>
      </button>
    </footer>
  </div>

  <!-- MODAL: GLOBAL SEARCH -->
  <div class="modal-overlay hidden" id="searchModal">
    <div class="modal-box modal-lg">
      <div class="modal-head">
        <span>GLOBAL SEARCH — AFM &amp; eQRH (EN + RU)</span>
        <button class="modal-close" data-close="searchModal">✕</button>
      </div>
      <div class="modal-body">
        <input type="search" id="globalSearchInput" class="search-input" placeholder="Search CAS alert (e.g. ECU A FAIL, OIL PRES), speed, limit, or Russian term...">
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>
  </div>

  <!-- MODAL: FAVORITES -->
  <div class="modal-overlay hidden" id="favModal">
    <div class="modal-box">
      <div class="modal-head">
        <span>FAVORITE UNITS &amp; PROCEDURES</span>
        <button class="modal-close" data-close="favModal">✕</button>
      </div>
      <div class="modal-body" id="favModalBody"></div>
    </div>
  </div>

  <!-- MODAL: CHAPTER NOTES -->
  <div class="modal-overlay hidden" id="notesModal">
    <div class="modal-box">
      <div class="modal-head">
        <span id="notesModalTitle">NOTES</span>
        <button class="modal-close" data-close="notesModal">✕</button>
      </div>
      <div class="modal-body">
        <textarea id="noteTextarea" class="note-area" placeholder="Add study or cockpit notes for this unit..."></textarea>
        <div class="modal-actions">
          <button id="btnDeleteNote" class="act-btn act-danger">CLEAR NOTE</button>
          <button id="btnSaveNote" class="act-btn act-primary">SAVE NOTE</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: DEFERRED ITEMS -->
  <div class="modal-overlay hidden" id="defModal">
    <div class="modal-box">
      <div class="modal-head">
        <span>DEFERRED eQRH ITEMS</span>
        <button class="modal-close" data-close="defModal">✕</button>
      </div>
      <div class="modal-body" id="defModalBody"></div>
    </div>
  </div>

  <!-- MODAL: DIAGRAM ZOOM VIEWER -->
  <div class="modal-overlay hidden" id="imgModal">
    <div class="modal-box modal-img">
      <div class="modal-head">
        <span id="imgModalTitle">DIAGRAM</span>
        <div class="img-zoom-ctrls">
          <button id="btnZoomOut" class="act-btn">−</button>
          <button id="btnZoomReset" class="act-btn">100%</button>
          <button id="btnZoomIn" class="act-btn">+</button>
          <button class="modal-close" data-close="imgModal">✕</button>
        </div>
      </div>
      <div class="img-stage" id="imgStage">
        <img id="imgModalEl" src="" alt="AFM Diagram">
      </div>
    </div>
  </div>

  <!-- GLOSSARY POPOVER -->
  <div id="glossaryPop" class="glossary-pop hidden"></div>

  <!-- DATA MODULES -->
  <script src="data/glossary.js"></script>
  <script src="data/eqrh_emergency.js"></script>
  <script src="data/eqrh_abnormal.js"></script>
  <script src="data/eqrh_normal.js"></script>
  <script src="data/afm_ch1_ch2.js"></script>
  <script src="data/afm_ch5_ch9.js"></script>
  <!-- ENGINE -->
  <script src="js/app.js"></script>
</body>
</html>

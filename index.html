<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DA40 NG">
  <meta name="theme-color" content="#ffffff" id="metaThemeColor">
  <title>DA40 NG — Flight Manual &amp; eQRH</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=7.0">
</head>
<body>
  <div id="app" class="app-shell">

    <!-- TOP NAVIGATION BAR -->
    <header class="navbar">
      <div class="nav-left">
        <div class="nav-history">
          <button id="btnBack" class="icon-btn" title="Back" aria-label="Back" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button id="btnFwd" class="icon-btn" title="Forward" aria-label="Forward" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>

      <div class="nav-center">
        <div class="segmented" id="layerTabs" role="tablist" aria-label="Workspace Tabs">
          <button class="seg-item active" data-layer="0" role="tab">Tab 1</button>
          <button class="seg-item" data-layer="1" role="tab">Tab 2</button>
          <button class="seg-item" data-layer="2" role="tab">Tab 3</button>
        </div>
      </div>

      <div class="nav-right">
        <button id="btnSearch" class="icon-btn" title="Search (EN + RU)" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>

        <button id="btnFavList" class="icon-btn" title="Favorites" aria-label="Favorites">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          <span id="favCount" class="pill-badge hidden">0</span>
        </button>

        <button id="btnNotes" class="icon-btn" title="Section Notes" aria-label="Notes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>
          </svg>
          <span id="noteDot" class="dot-badge hidden"></span>
        </button>

        <button id="btnDeferred" class="icon-btn hidden" title="Deferred eQRH Items" aria-label="Deferred">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/>
          </svg>
          <span id="defCount" class="pill-badge pill-amber">0</span>
        </button>

        <div class="segmented seg-lang" id="langSwitch" title="Document Language">
          <button class="seg-item active" data-lang="en">EN</button>
          <button class="seg-item" data-lang="ru">RU</button>
        </div>

        <button id="btnTheme" class="icon-btn" title="Switch Appearance" aria-label="Appearance"></button>
      </div>
    </header>

    <!-- FLYSMART-STYLE HIERARCHICAL CHEVRON BREADCRUMB BAR -->
    <nav class="crumb-bar" id="crumbBar" aria-label="Document Navigation"></nav>

    <!-- FULL-WIDTH READER CANVAS -->
    <div class="workspace">
      <main class="reader-pane" id="readerPane">
        <article class="reader-inner" id="readerContent"></article>
      </main>
    </div>

    <!-- APPLE-STYLE BOTTOM TAB BAR -->
    <footer class="tabbar">
      <button class="tab-btn active" data-module="afm" id="dockAfm">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span>AFM</span>
      </button>
      <button class="tab-btn" data-module="eqrh" id="dockEqrh">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span>eQRH</span>
      </button>
      <button class="tab-btn" data-module="sop" id="dockSop">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
        <span>Checklists</span>
      </button>
      <button class="tab-btn" data-module="tools" id="dockTools">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </button>
    </footer>
  </div>

  <!-- FLOATING BREADCRUMB DROPDOWN MENU -->
  <div id="crumbMenu" class="crumb-menu hidden" role="menu"></div>

  <!-- FLOATING TEXT HIGHLIGHTER POPOVER (Apple Books Style) -->
  <div id="hlPopover" class="hl-popover hidden" role="toolbar" aria-label="Highlight Text">
    <button class="hl-dot hl-dot-yellow" data-hl-color="yellow" title="Highlight Yellow" aria-label="Yellow"></button>
    <button class="hl-dot hl-dot-green" data-hl-color="green" title="Highlight Green" aria-label="Green"></button>
    <button class="hl-dot hl-dot-red" data-hl-color="red" title="Highlight Red" aria-label="Red"></button>
    <span class="hl-sep hidden" id="hlSep"></span>
    <button class="hl-del hidden" id="hlDeleteBtn" data-hl-color="clear" title="Remove Highlight" aria-label="Remove">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- GLOSSARY POPOVER -->
  <div id="glossaryPop" class="glossary-pop hidden"></div>

  <!-- MODAL: GLOBAL SEARCH -->
  <div class="modal-overlay hidden" id="searchModal">
    <div class="modal-sheet modal-lg">
      <div class="modal-head">
        <span>Search</span>
        <button class="modal-close" data-close="searchModal">Done</button>
      </div>
      <div class="modal-body">
        <div class="modal-search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="globalSearchInput" placeholder="CAS alert, speed, limitation, or Russian term…">
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>
  </div>

  <!-- MODAL: FAVORITES / BOOKMARKS -->
  <div class="modal-overlay hidden" id="favModal">
    <div class="modal-sheet">
      <div class="modal-head">
        <span id="favModalTitle">Favorites</span>
        <button class="modal-close" data-close="favModal">Done</button>
      </div>
      <div class="modal-body" id="favModalBody"></div>
    </div>
  </div>

  <!-- MODAL: SECTION NOTES -->
  <div class="modal-overlay hidden" id="notesModal">
    <div class="modal-sheet">
      <div class="modal-head">
        <span id="notesModalTitle">Notes</span>
        <button class="modal-close" data-close="notesModal">Cancel</button>
      </div>
      <div class="modal-body">
        <textarea id="noteTextarea" class="note-area" placeholder="Write your study or flight notes for this section…"></textarea>
        <div class="modal-actions">
          <button id="btnDeleteNote" class="btn btn-destructive">Clear</button>
          <button id="btnSaveNote" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: DEFERRED ITEMS -->
  <div class="modal-overlay hidden" id="defModal">
    <div class="modal-sheet">
      <div class="modal-head">
        <span>Deferred Items</span>
        <button class="modal-close" data-close="defModal">Done</button>
      </div>
      <div class="modal-body" id="defModalBody"></div>
    </div>
  </div>

  <!-- MODAL: DIAGRAM ZOOM VIEWER -->
  <div class="modal-overlay hidden" id="imgModal">
    <div class="modal-sheet modal-img">
      <div class="modal-head">
        <span id="imgModalTitle">Diagram</span>
        <div class="img-zoom-ctrls">
          <button id="btnZoomOut" class="btn btn-sm">−</button>
          <button id="btnZoomReset" class="btn btn-sm">100%</button>
          <button id="btnZoomIn" class="btn btn-sm">+</button>
          <button class="modal-close" data-close="imgModal">Done</button>
        </div>
      </div>
      <div class="img-stage" id="imgStage">
        <img id="imgModalEl" src="" alt="Diagram">
      </div>
    </div>
  </div>

  <!-- DATA MODULES -->
  <script src="data/glossary.js?v=7.0"></script>
  <script src="data/eqrh_emergency.js?v=7.0"></script>
  <script src="data/eqrh_abnormal.js?v=7.0"></script>
  <script src="data/eqrh_normal.js?v=7.0"></script>
  <script src="data/afm_full.js?v=7.0"></script>
  <!-- ENGINE -->
  <script src="js/app.js?v=7.0"></script>
</body>
</html>
